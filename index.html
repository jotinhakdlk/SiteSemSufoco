<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Sufoco</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div></div>
        <div id="divlogo">
            <img src="img/logoSemSufocoSemFundo.png" alt="Logo Sem Sufoco" class="logo">
        </div>
        <div></div>
    </header>

    <main id="mainCadastro">
        <div></div>

        <div id="TelaLogin">
            <h2 id="tituloLogin">Primeiro, vamos criar sua conta!</h2>

            <p><strong>Seu Nome Completo:</strong></p>
            <input
                type="text"
                placeholder="Nome e Sobrenome..."
                class="InputCadastro"
                id="nomeUsuario"
            >

            <p><strong>Email:</strong></p>
            <input
                type="email"
                placeholder="Seu Email Aqui..."
                class="InputCadastro"
                id="emailUsuario"
            >

            <p><strong>Sua Renda Fixa Mensal:</strong></p>
            <input
                type="number"
                min="0"
                step="0.01"
                placeholder="Sua Receita Por Mês..."
                class="InputCadastro"
                id="rendaMensal"
            >

            <p id="aviso"></p>
            <button class="BotaoCadastro" onclick="CadastroConta()">Cadastrar</button>
        </div>

        <div></div>
    </main>

    <!-- O cadastro fica separado da lógica da tela inicial. -->
    <script src="js/login.js"></script>
</body>
</html>
